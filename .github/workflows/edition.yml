name: Édition du jour

on:
  schedule:
    # 4h40 et 6h10 UTC : 6h40 / 8h10 à Paris en été, 5h40 / 7h10 en hiver.
    # Le second passage rattrape les unes publiées tard.
    - cron: "40 4 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter et générer le site
        run: python scripts/build.py
      - name: Sonde (temporaire)
        continue-on-error: true
        run: python scripts/sonde.py
      - name: Archiver les données du jour
        run: |
          mkdir -p data/archives
          cp data/brut.json "data/archives/$(TZ=Europe/Paris date +%F).json"
          git config user.name "kiosque-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Édition du $(TZ=Europe/Paris date +%F)"
          git pull --rebase -q origin main && git push -q origin HEAD:main || echo "push ignoré"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
